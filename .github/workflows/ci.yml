name: CI

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Nix Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v17
        with:
          name: opencouncil
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          # Don't cache npm deps: importNpmLock produces one .tgz fetchurl per
          # package plus an opencouncil-*-sources lockfile derivation, all
          # cheaply re-fetched from the npm registry.
          pushFilter: "(\\.tgz$|opencouncil-.*-sources$)"

      - run: nix flake check --print-build-logs

  notis:
    name: Notis (services/notis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Derived from engines.node rather than repeated here: setup-node
          # reads volta.node, then devEngines.runtime, then engines.node from
          # the manifest, and this repo declares only the last. One fewer place
          # for the Node version to drift.
          node-version-file: package.json
          cache: npm

      # Workspace install at the root covers packages/ui and services/notis.
      - run: npm ci

      # The generated Prisma clients are gitignored; typecheck needs them.
      - run: npm run prisma:generate -w notis

      - run: npx tsc --noEmit
        working-directory: services/notis

      - run: npm test -w notis

      - run: SKIP_ENV_VALIDATION=1 npm run build -w notis

      # The template mirror in src/agent/templates.ts is a hand-copy of the
      # Bird console, and only Bird knows when it goes stale. A variable added
      # there makes every send of that shell fail with a terminal 422 that
      # degrades quietly to SMS, so the check belongs before the deploy rather
      # than in a reader's inbox.
      #
      # Skipped without credentials — forks and Dependabot cannot read secrets,
      # and a missing key must not fail their builds. It still runs on every
      # push to this repository, which is where a template edit lands.
      - name: Check the Bird template mirror for drift
        # The skip is a shell test rather than a step `if`: a step's own env
        # block is not visible to its condition, and `secrets` is not available
        # there either. This way the skip is also visible in the log.
        run: |
          if [ -z "$BIRD_API_KEY" ]; then
            echo "No Bird credentials in this context — skipping the drift check."
            exit 0
          fi
          npm run check:templates -w notis
        env:
          BIRD_API_KEY: ${{ secrets.BIRD_API_KEY }}
          BIRD_WORKSPACE_ID: ${{ secrets.BIRD_WORKSPACE_ID }}
          BIRD_WHATSAPP_TEMPLATE_DEMOS_INTRO: ${{ secrets.BIRD_WHATSAPP_TEMPLATE_DEMOS_INTRO }}
          BIRD_WHATSAPP_TEMPLATE_DEMOS_TRANSITION: ${{ secrets.BIRD_WHATSAPP_TEMPLATE_DEMOS_TRANSITION }}
          BIRD_WHATSAPP_TEMPLATE_DEMOS_UPDATE_AGENDA: ${{ secrets.BIRD_WHATSAPP_TEMPLATE_DEMOS_UPDATE_AGENDA }}
          BIRD_WHATSAPP_TEMPLATE_DEMOS_UPDATE_NEWS: ${{ secrets.BIRD_WHATSAPP_TEMPLATE_DEMOS_UPDATE_NEWS }}
          BIRD_WHATSAPP_TEMPLATE_DEMOS_FOLLOWUP: ${{ secrets.BIRD_WHATSAPP_TEMPLATE_DEMOS_FOLLOWUP }}
          SKIP_ENV_VALIDATION: "1"

  integration:
    name: Integration (testcontainers)
    runs-on: ubuntu-latest
    # The suite runs in about two minutes. A container that never becomes
    # ready would otherwise hold the runner for the six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      # Both generated clients: the contract suites exercise the main views
      # AND the notis queue against real PostgreSQL containers.
      - run: npm run prisma:generate
      - run: npm run prisma:generate -w notis

      # The suites CI could not previously see: view/grant contracts
      # (notis-views, notis-rollout, notis-exclusion), queue claims
      # (notis-queue), migration replay, and the notification paths.
      # Serially: parallel testcontainers flake under contention (observed
      # locally — 9 spurious failures hot, 0 after warmup); CI runners are
      # slower still, and a deterministic 2-minute job beats a fast red one.
      - run: npm run test:integration -- --runInBand
