name: CI

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Nix Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v17
        with:
          name: opencouncil
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          # Don't cache npm deps: importNpmLock produces one .tgz fetchurl per
          # package plus an opencouncil-*-sources lockfile derivation, all
          # cheaply re-fetched from the npm registry.
          pushFilter: "(\\.tgz$|opencouncil-.*-sources$)"

      - run: nix flake check --print-build-logs

  notis:
    name: Notis (services/notis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          # Derived from engines.node rather than repeated here: setup-node
          # reads volta.node, then devEngines.runtime, then engines.node from
          # the manifest, and this repo declares only the last. One fewer place
          # for the Node version to drift.
          node-version-file: package.json
          cache: npm

      # Workspace install at the root covers packages/ui and services/notis.
      - run: npm ci

      - run: npx tsc --noEmit
        working-directory: services/notis

      - run: npm test -w notis

      - run: SKIP_ENV_VALIDATION=1 npm run build -w notis
